version: '3.8'

services:
  influxdb:
    image: influxdb:1.8
    container_name: esp32-influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=${INFLUXDB_DB:-k6}
      - INFLUXDB_ADMIN_USER=${INFLUXDB_ADMIN_USER:-admin}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-admin}
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - k6-network

  grafana:
    image: grafana/grafana:latest
    container_name: esp32-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - INFLUXDB_ADMIN_USER=${INFLUXDB_ADMIN_USER:-admin}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb
    networks:
      - k6-network

  k6:
    image: grafana/k6:latest
    container_name: esp32-k6
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
      - ESP32_URL=${ESP32_URL:-http://192.168.1.100}
    volumes:
      - ./esp32-perftest.js:/scripts/esp32-perftest.js
    command: run /scripts/esp32-perftest.js
    depends_on:
      - influxdb
      - grafana
    networks:
      - k6-network
    profiles:
      - run

volumes:
  influxdb-data:
  grafana-data:

networks:
  k6-network:
    driver: bridge
